<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Account Authentication | Cliff O Global</title>
  
  <!-- Global Fonts & Icons Architecture -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      
      
      <div class="auth-header">
        <a href="index.html" class="auth-brand-logo">
          <img src="assets/logoh1.png" alt="Cliff O Global Logo">
          CLIFFO<span>GLOBAL</span>
        </a>
        <h1>Welcome Back</h1>
        <p>Access your secure global marketplace dashboard portal.</p>
      </div>

      <!-- Authentication Submission Form -->
      <form>
        
        <!-- Email Input Node -->
        <div class="input-group">
          <label for="userEmail">Enter Username</label>
          <div class="input-field-wrapper">
            <i class="fa-solid fa-envelope field-icon"></i>
            <input type="text" id="email" name="email" placeholder="OLX" required autocomplete="email">
          </div>
        </div>

        <!-- Password Input Node -->
        <div class="input-group">
          <div class="label-row">
            <label for="userPassword">Security Password</label>
            <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
          </div>
          <div class="input-field-wrapper">
            <i class="fa-solid fa-lock field-icon"></i>
            <input type="password" name="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" id="togglePasswordVisibility" class="visibility-toggle-btn" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Persistence Remember Option Context -->
        <div class="auth-utilities-row">
          <label class="custom-checkbox-container">
            <input type="checkbox" id="rememberMe">
            <span class="checkmark"></span>
            Keep me authenticated on this device
          </label>
        </div>

        <!-- Secure Form Execution CTA Button -->
        <button type="submit" class="auth-submit-btn">
          <span>Secure Sign In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>

      </form>

      <!-- Alternate Action Notice Registration Node Link -->
      <div class="auth-footer-notice">
       
      </div>

    </div>
  </div>

  <!-- Optional basic script to make the show/hide password toggle function working -->
<script>
    const form = document.querySelector("form")

form.addEventListener("submit",(e)=>{
	e.preventDefault()
	
	const email = form.email.value
	const password = form.password.value
	
	const authenticated = authentication(email,password)
	
	if(authenticated){
		window.location.href = "key03515732hxx9mt4gljsbvacy35uwff.html"
	}else{
		alert("wrong ")
	}
	
})

//  function for checking username and password

function authentication(email,password){
	if(email === "Clifford2nice" && password === "P1234"){
		return true
	}else{
		return false
	}
	
}
</script>

  <script>
    const passwordInput = document.getElementById('userPassword');
    const toggleBtn = document.getElementById('togglePasswordVisibility');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
    });

    
  </script>

</body>
</html>
